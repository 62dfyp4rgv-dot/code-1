name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run validate:data
      - run: npm run test:fast
      - name: UI tests (Chromium device emulation)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run ui:test
  # Unverified: this job has never been executed by the authors (no Xcode available during development).
  ios-build:
    if: ${{ false }}   # enable on a macOS runner once a signing team is configured
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash tools/ios-sync.sh && cd ios && xcodegen && xcodebuild -scheme ModernAge -destination 'platform=iOS Simulator,name=iPhone 15' build test CODE_SIGNING_ALLOWED=NO
